[package]
name = "ssh-pty-terminal"
version = "1.0.0"
description = "PTY terminal for Android"
authors = ["AI Studio"]
edition = "2021"

[lib]
name = "ssh_pty_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
